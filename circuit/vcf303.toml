# vcf303 — TB-303 / TD-3 diode-ladder VCF, STEP 2a = ladder core + T38
# differential input stage (the active bottom drive).
#
# STEP 2a (this file): the bare ladder of step 1 PLUS the real T38 differential
# input stage (DMMT3904W dual NPN = matched 2N3904). T38 replaces the step-1
# harness's ideal bottom AC drive + DC sink: its two collectors feed the ladder
# bottom rails (dl,dr); its emitters degenerate through R164/R161 (2.2K) into a
# shared tail; the tail current = the EXPO-converter output = the ladder bias =
# CUTOFF (still parameterised, injected by the harness as an ideal sink, per
# VCF_MAP.md item 3 — do NOT transcribe the T7/T11 expo literally). The signal
# enters as the differential base voltage (in_l vs in_r). The ladder TOP (tl,tr)
# is biased from the +8V analog rail through R95 (10K per rail; C87's 10µF just
# stiffens the rail, modelled ideal), which also forms the differential readout
# load. T20/T22 gain readout + T21 output buffer = STEP 2b/2c (still OUT).
# Active stages map: see eval/303/VCF_MAP.md.
#
# --- STEP 1 (ladder core) notes retained below ---
#
# The diode ladder only: 4 rungs × 2 rails = 8 diodes (the diode-connected
# 2SC1583 pairs of the real filter, modelled as 1N4148 per the Stinchcombe
# diode-ladder analysis) + 4 shunt caps bridging the two rails. The active
# stages (T38 diff input, T20/T22 gain, T21 buffer, T23 resonance, T7/T11 expo
# cutoff) are deliberately OUT for this step — see eval/303/VCF_MAP.md. The
# harness (eval/303/run_vcf303_spice.py) injects the parameterised ladder bias
# current (= cutoff) at the TOP and the differential AC signal at the BOTTOM,
# and provides the DC sink + ground reference. None of the ladder nodes are
# `known`: the harness attaches current/AC sources to them externally, so they
# stay solved (a both-known shunt cap would be inert — the wdf_drop trap).
#
# Rails / DC: bias current I flows TOP(tl,tr) -> down each rail through the
# series diodes -> BOTTOM(dl,dr) sink. Diode r_small = Vt/I, shunt caps C =>
# cutoff wc ~ I/(Vt*C): cutoff tracks the bias current (like BA283's R_KJ leg).
# Signal: differential AC injected at the bottom (dl,dr), 4-pole LP read at the
# top (tl,tr). Souped tap-select poles (step 5) will expose a/b/c as probes.

[meta]
name = "vcf303"
ground = "GND"
num_nodes = 30
listening_node = "out"

# --- left rail, top -> bottom ---
[[node]]
name = "tl"   # top-left: readout + bias-current inject (4-pole tap)

[[node]]
name = "al"   # after rung 1 (2-pole tap)

[[node]]
name = "bl"   # after rung 2 (3-pole tap)

[[node]]
name = "cl"   # after rung 3

[[node]]
name = "dl"   # bottom-left: differential signal inject + DC sink

# --- right rail, top -> bottom ---
[[node]]
name = "tr"

[[node]]
name = "ar"

[[node]]
name = "br"

[[node]]
name = "cr"

[[node]]
name = "dr"

# --- step 2a: rail, T38 diff-input stage + tail (harness drives vp8/in_l/in_r/tail) ---
[[node]]
name = "vp8"   # +8V analog rail (harness Vsource); top-bias + collector return

[[node]]
name = "in_l"  # T38 left base = signal input (harness AC drive)

[[node]]
name = "in_r"  # T38 right base = signal reference (harness DC bias, AC ground)

[[node]]
name = "eL"    # T38 left emitter (degenerates through R164 to tail)

[[node]]
name = "eR"    # T38 right emitter (degenerates through R161 to tail)

[[node]]
name = "tail"  # T38 shared emitter tail = expo bias current sink (= cutoff)

# --- step 2b: T20/T22 differential gain stage + T21 output buffer ---
# T20 reads the ladder top DIFFERENTIALLY and DC-coupled (bases = tl,tr); the
# diode-ladder DC level (~7.8V) biases the pair directly. Collector loads R83/R84
# -> +8V. T22 is the real tail current sink (emitter degen R96 -> a3 = the 3V3
# offset rail "A" net). The SIGNAL path (T20 pair + R83/R84 + T21 buffer) is
# transcribed faithfully; the gain-stage BIAS — the on-board R120/R122/R123
# divider that I could not read confidently from the schematic — is ABSTRACTED to
# a single harness-driven T22-base voltage (node m2), exactly as the cutoff expo
# (T7/T11) is abstracted to a parameterised current (VCF_MAP item 3). T21 is the
# emitter-follower output buffer. Closed-loop resonance feedback (T23) = step 3.
[[node]]
name = "a3"    # "A" net = 3V3 mod-offset rail (harness Vsource); bias reference

[[node]]
name = "c20l"  # T20 left collector (load R83 -> +8V)

[[node]]
name = "c20r"  # T20 right collector (load R84 -> +8V) = T21 base = output drive

[[node]]
name = "e20"   # T20 shared emitter tail (= T22 collector)

[[node]]
name = "m2"    # T22 base = abstracted gain-stage bias (harness Vsource)

[[node]]
name = "t22e"  # T22 emitter (degen R96 -> a3)

[[node]]
name = "out"   # T21 emitter-follower output (-> X12-1)

# --- step 3 (WIP): Q9/Q10/Q11 ACTIVE resonance feedback (the SOUPED self-osc lever) ---
# REWORKED 2026-06-26 per the Roland sheet re-read (VCF_MAP §10/§11). The OLD model
# fed the output back through a UNITY emitter-follower (T23) — a passive buffer that
# can never raise the loop gain past 1, so no resonance peak emerged at any Rreso.
# The REAL 303 feedback is an ACTIVE gain block: Q9 is a common-emitter INVERTING
# amplifier (emitter degenerated to GND through R71, base fed from the output via
# R64/R65, collector loaded to +8V) buffered out by Q10/Q11 — it provides the
# regenerative VOLTAGE GAIN the unity buffer lacked. Here Q9 is transcribed as the
# single CE gain stage (Q10/Q11 = its output buffer, abstracted: the EF `out` already
# buffers); its amplified, inverted output is AC-coupled (C23) and injected through
# the resonance leg `Rreso` (param, the RESONANCE pot VR4) into the `in_r` diff
# input. Inject = in_r (NOT in_l): Q9 inverts, so feeding the OTHER base of the
# input pair makes the loop NEGATIVE at DC (stable) but POSITIVE near fc once the
# ladder's own phase lag rotates the sign — the textbook way a multipole filter
# resonates. Measured: an fc-TRACKING peak (up to ~20 dB) whose centre follows the
# bias current (532 Hz @16µA -> 2.7 kHz @128µA). The CE stage taps the LOW-impedance
# `out` follower (no readout loading) and reaches the input ONLY through `Rreso`;
# Rreso = RRESO_OFF (1e12) fully opens the leg => step-2b behaviour is bit-exact (the
# gain stage idles with its output going nowhere). Smaller Rreso => more feedback up
# to an optimum Q (~47k); the stock loop is self-limiting (no self-osc without a
# higher-gain "Devil-Fish" regime — a souped follow-up).
# Q9 base DC bias (Rb1/Rb2 divider off +8V) is ABSTRACTED, like the cutoff expo and
# the T22 gain divider (VCF_MAP item 3) — only the SIGNAL path is transcribed.
[[node]]
name = "sig"   # signal input (harness Vsource) -> R27 -> in_l summing node

[[node]]
name = "bref"  # in_r DC bias reference (harness Vsource) -> R_br -> in_r

[[node]]
name = "fbac"  # output AC-coupled (C23) into the Q9 feedback amp input

[[node]]
name = "bq9"   # Q9 base (CE resonance amp): R64 from fbac + Rb1/Rb2 bias divider

[[node]]
name = "eq9"   # Q9 emitter — degenerated to GND through R71 (sets the CE gain)

[[node]]
name = "cq9"   # Q9 collector — load Rc9 -> +8V; the amplified, INVERTED feedback

[[node]]
name = "fbinj" # cq9 AC-coupled (C_out) -> resonance leg Rreso -> in_r (inject)

# --- ladder series diodes (anode = top, cathode = bottom; bias current flows
#     top -> bottom through all four rungs of each rail) ---
[[diode]]
name = "D1L"
nodes = ["tl", "al"]
model = "1N4148"

[[diode]]
name = "D1R"
nodes = ["tr", "ar"]
model = "1N4148"

[[diode]]
name = "D2L"
nodes = ["al", "bl"]
model = "1N4148"

[[diode]]
name = "D2R"
nodes = ["ar", "br"]
model = "1N4148"

[[diode]]
name = "D3L"
nodes = ["bl", "cl"]
model = "1N4148"

[[diode]]
name = "D3R"
nodes = ["br", "cr"]
model = "1N4148"

[[diode]]
name = "D4L"
nodes = ["cl", "dl"]
model = "1N4148"

[[diode]]
name = "D4R"
nodes = ["cr", "dr"]
model = "1N4148"

# --- shunt caps bridging the two rails (one per inter-rung level = 4 poles).
#     Bottom (input) level = .018µF (C101), the three upper = .033µF
#     (C98/C99/C100) per VCF_MAP.md. ---
[[capacitor]]
name = "C98"
nodes = ["al", "ar"]
farads = 3.3e-08
dielectric = "film"

[[capacitor]]
name = "C99"
nodes = ["bl", "br"]
farads = 3.3e-08
dielectric = "film"

[[capacitor]]
name = "C100"
nodes = ["cl", "cr"]
farads = 3.3e-08
dielectric = "film"

[[capacitor]]
name = "C101"
nodes = ["dl", "dr"]
farads = 1.8e-08
dielectric = "film"

# --- step 2a: top-of-ladder bias from +8V rail (R95 per rail; also the
#     differential readout load). C87 10µF stiffens the rail (modelled ideal). ---
[[resistor]]
name = "R95L"
nodes = ["vp8", "tl"]
ohms = 10000.0
material = "carbon_film"

[[resistor]]
name = "R95R"
nodes = ["vp8", "tr"]
ohms = 10000.0
material = "carbon_film"

# --- step 2a: T38 differential input stage (DMMT3904W dual NPN) ---
# collectors -> ladder bottom (dl,dr); emitters -> R164/R161 degen -> tail sink.
[[resistor]]
name = "R164"
nodes = ["eL", "tail"]
ohms = 2200.0
material = "carbon_film"

[[resistor]]
name = "R161"
nodes = ["eR", "tail"]
ohms = 2200.0
material = "carbon_film"

[[bjt]]
name = "T38L"
model = "2N3904"
base = "in_l"
emitter = "eL"
collector = "dl"

[[bjt]]
name = "T38R"
model = "2N3904"
base = "in_r"
emitter = "eR"
collector = "dr"

# --- step 2b: T20/T22 gain stage + T21 buffer ---
# T20 diff pair collector loads -> +8V rail
[[resistor]]
name = "R83"
nodes = ["vp8", "c20l"]
ohms = 22000.0
material = "carbon_film"

[[resistor]]
name = "R84"
nodes = ["vp8", "c20r"]
ohms = 22000.0
material = "carbon_film"

# T22 tail-sink emitter degeneration -> a3
[[resistor]]
name = "R96"
nodes = ["t22e", "a3"]
ohms = 2200.0
material = "carbon_film"

# T21 emitter-follower load -> a3
[[resistor]]
name = "R85"
nodes = ["out", "a3"]
ohms = 10000.0
material = "carbon_film"

[[bjt]]
name = "T20L"
model = "2N3904"
base = "tl"
emitter = "e20"
collector = "c20l"

[[bjt]]
name = "T20R"
model = "2N3904"
base = "tr"
emitter = "e20"
collector = "c20r"

[[bjt]]
name = "T22"
model = "2N3904"
base = "m2"
emitter = "t22e"
collector = "e20"

[[bjt]]
name = "T21"
model = "2N3904"
base = "c20r"
emitter = "out"
collector = "vp8"

# --- step 3: Q9/Q10/Q11 active resonance feedback amp + leg ---
# signal input resistor: sig -> in_l (summing node; also the feedback inject node)
[[resistor]]
name = "R27"
nodes = ["sig", "in_l"]
ohms = 100000.0
material = "carbon_film"

# in_r DC bias resistor: bref -> in_r (matches R27 so both inputs see equal source Z)
[[resistor]]
name = "R_br"
nodes = ["bref", "in_r"]
ohms = 100000.0
material = "carbon_film"

# C23 AC-couples the filter OUTPUT into the Q9 resonance amp (real C23 = 1µF/50).
# The EF `out` is low-Z, so this tap does not load the readout.
[[capacitor]]
name = "C23"
nodes = ["out", "fbac"]
farads = 1e-06
dielectric = "film"

# R64: AC feedback signal from fbac -> Q9 base (real R64 10K).
[[resistor]]
name = "R64"
nodes = ["fbac", "bq9"]
ohms = 10000.0
material = "carbon_film"

# Q9 base DC bias divider off +8V (ABSTRACTED — the on-board R65/bias network was
# not legibly traceable; sets Q9 forward-active, base ~1.0V). Rb1 top, Rb2 bottom.
[[resistor]]
name = "Rb1"
nodes = ["vp8", "bq9"]
ohms = 680000.0
material = "carbon_film"

[[resistor]]
name = "Rb2"
nodes = ["bq9", "GND"]
ohms = 100000.0
material = "carbon_film"

# R71: Q9 emitter degeneration -> GND. Fixes the CE voltage gain ~= Rc9/R71. This
# is the GAIN the old unity-EF T23 lacked (real R71 2.2K).
[[resistor]]
name = "R71"
nodes = ["eq9", "GND"]
ohms = 2200.0
material = "carbon_film"

# Rc9: Q9 collector load -> +8V. Sets the DC collector point (~mid-rail) and, with
# R71, the CE gain (~27k/2.2k ~= 12x). Abstracted value (Q10/Q11 buffer folded in).
[[resistor]]
name = "Rc9"
nodes = ["vp8", "cq9"]
ohms = 27000.0
material = "carbon_film"

# C_out AC-couples the amplified, inverted Q9 collector to the resonance leg, so
# the leg injects only AC (the shared Q9/Q12 DC bias is abstracted).
[[capacitor]]
name = "C_out"
nodes = ["cq9", "fbinj"]
farads = 1e-06
dielectric = "film"

# resonance leg (SOUPED self-osc lever) = the RESONANCE pot VR4. AC-coupled,
# AMPLIFIED feedback into in_r (regenerative near fc — see the node-list comment).
# `rreso` is the build-arg; smaller -> stronger feedback -> higher resonance up to
# the optimum Q (~47k). RRESO_OFF (1e12) opens the leg => step-2b bit-exact.
[[resistor]]
name = "Rreso"
nodes = ["fbinj", "in_r"]
ohms = 47000.0
material = "carbon_film"
param = "rreso"

# Q9 = the common-emitter INVERTING resonance amplifier (the regenerative gain).
[[bjt]]
name = "Q9"
model = "2N3904"
base = "bq9"
emitter = "eq9"
collector = "cq9"

[model.1N4148]
type = "d"
is = 1.4199999999999998e-11
rs = 4.2
n = 1.7
bv = 75.0
ibv = 4.9999999999999996e-06
cjo = 1.7399999999999999e-12
vj = 0.75
m = 0.333
tt = 4.320000000000001e-09

[model.2N3904]
type = "npn"
is = 6.73e-15
bf = 416.4
vaf = 74.03
ikf = 0.06678
ise = 6.73e-15
ne = 1.259
br = 0.7374
rb = 10.0
rc = 1.0
cje = 4.5e-12
tf = 3.012e-10
xtf = 2.0
vtf = 4.0
itf = 0.4
cjc = 3.638e-12
mjc = 0.3085
tr = 2.395e-07
xtb = 1.5
kf = 9e-16
