# Cargo.toml
[workspace]
# `xtask` is the nih-plug bundler runner; `plugin303` is the TB-303 voice
# (Phase-2 plan, docs/plans/2026-06-26-phase2-303-voice-implementation-plan.md).
members = ["xtask", "plugin303"]
resolver = "2"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

# Profile-first optimization round.  Two variants for symbol attribution:
#   profiling     — matches release (fat-LTO) but with debuginfo + frame-pointers;
#                   symbols may be inlined/blurred under fat-LTO — use as baseline.
#   profiling-thin — thin-LTO for cleaner per-function attribution; otherwise same.
# Render with: cargo build --profile profiling --bin standalone
[profile.profiling]
inherits = "release"
debug = 2
strip = "none"
# force-frame-pointers is a codegen-options flag; set via RUSTFLAGS in the harness.

[profile.profiling-thin]
inherits = "profiling"
lto = "thin"
codegen-units = 4      # thin-LTO benefits from >1 CGU for better attribution

# Tests render 10k-144k samples of Newton-solver DSP; opt-level 0 makes them
# 5-15x slower. debug-assertions MUST stay on: assert_no_alloc's warn_debug
# (tests/no_alloc.rs) is compiled under cfg(debug_assertions).
[profile.test]
inherits = "dev"
opt-level = 1            # dependencies: cheap to compile
debug-assertions = true
overflow-checks = false  # verified: no test relies on overflow panics

# plugin303's own DSP is the hot loop; opt-3 only this crate, not egui/nih_plug.
[profile.test.package.plugin303]
opt-level = 3

[patch."https://github.com/RustAudio/baseview.git"]
baseview = { path = "vendor/baseview" }
