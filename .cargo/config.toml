[alias]
xtask = "run --package xtask --release --"

# Distributable ISA floor for shipped x86_64 builds (VST3 + standalone).
# Profile-first round found the build was generic x86-64 (SSE2): no AVX2/FMA,
# non-inlined libm `floor`. x86-64-v3 (AVX2+FMA+BMI, Haswell-2013+/Excavator-2015+)
# measured +9.8% on the WDF hot path, BIT-IDENTICAL output (Rust does not auto-
# contract FMA, so no numeric change — rust↔cpp parity + vs-SPICE unaffected).
# Scoped to `cfg(target_arch="x86_64")` so it never touches aarch64 (Apple
# Silicon) or host build-tools. The eval harnesses set env RUSTFLAGS=
# `-C target-cpu=native`, which fully overrides this — bench/data-gen stay native.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=x86-64-v3"]
