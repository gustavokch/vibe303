name: ci-self-hosted

# Test gate. Runs the BA283 test suite on every push to main and every pull
# request — the only workflow that runs `cargo test` (mac.yml/release.yml only
# bundle). Closes the gap where the `measure` alias-sweep regression guard and
# the rest of plugin/tests/ never executed in CI.
#
# Linux x86_64 only: the DSP is platform-agnostic, so one runner is sufficient.

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so PR pushes don't pile up runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (linux x86_64)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build deps
        # Same set as release.yml — building the ba283 lib pulls the baseview/GUI
        # deps even for headless DSP tests.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libasound2-dev libgl-dev libjack-dev libx11-xcb-dev libxcb1-dev \
            libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: Default test suite
        # `probe_latency_is_documented` is a wall-clock ceiling (noisy under CI
        # load by its own admission) — skip it by name; everything else is
        # deterministic. Release: faster for the heavy DSP tests + shares the
        # compile with the guard step.
        run: cargo test -p ba283 --release -- --skip probe_latency_is_documented
      - name: Alias-sweep regression guard (measure feature)
        run: cargo test -p ba283 --release --features measure --test alias_sweep
      - name: Additive-feature build guard (--no-default-features)
        run: cargo build -p ba283 --no-default-features
