name: build-plugins-linux

# Manual trigger only. Builds VST3 + CLAP bundles, uploads them as zips, and
# (optionally) attaches the zips to a GitHub Release.
#  - linux-x86_64-v3 : native build on a self-hosted Ubuntu 24.04 x64 runner (AVX2).
#  - macos-arm64     : cross-compiled on the SAME linux runner via zig + cargo-zigbuild.
#  - release         : downloads both zips and publishes a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (blank = build-<sha8>, no release published if 'release' input is false)"
        required: false
        default: ""
      release:
        description: "Publish a GitHub Release with the zips"
        type: boolean
        default: true
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: true
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: false

permissions:
  contents: write   # required for the release job to create tags/releases

env:
  PKG: plugin303
  BUNDLE_NAME: TB303
  CARGO_TERM_COLOR: always

jobs:
  linux-x86_64-v3:
    runs-on: [self-hosted, linux, x64]   # Ubuntu 24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: | 
          sudo apt-get update 
          sudo apt-get install -y pkg-config libasound2-dev libjack-dev

      - name: Install Rust (x86_64 host)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build + bundle (x86-64-v3 / AVX2)
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v3"
        run: |
          cargo xtask bundle "$PKG" --release --target x86_64-unknown-linux-gnu

      - name: Locate bundles
        id: find
        run: |
          DIR="target/x86_64-unknown-linux-gnu/bundled"
          [ -d "$DIR" ] || DIR="target/bundled"
          test -e "$DIR/${BUNDLE_NAME}.vst3"
          test -e "$DIR/${BUNDLE_NAME}.clap"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Package zip
        run: |
          OUT="${BUNDLE_NAME}-linux-x86_64-v3-${GITHUB_SHA::8}"
          STAGE="$RUNNER_TEMP/$OUT"
          mkdir -p "$STAGE"
          cp -r "${{ steps.find.outputs.dir }}/${BUNDLE_NAME}.vst3" "$STAGE/"
          cp -r "${{ steps.find.outputs.dir }}/${BUNDLE_NAME}.clap" "$STAGE/"
          ( cd "$RUNNER_TEMP" && zip -r "$OUT.zip" "$OUT" )
          echo "ZIP=$RUNNER_TEMP/$OUT.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE_NAME }}-linux-x86_64-v3
          path: ${{ env.ZIP }}
          if-no-files-found: error

  release:
    if: ${{ inputs.release }}
    needs: [linux-x86_64-v3]
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute release tag
        id: meta
        env:
          IN_TAG: ${{ inputs.tag }}
        run: |
          TAG="$IN_TAG"
          [ -n "$TAG" ] || TAG="build-${GITHUB_SHA::8}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.zip
