# CI that runs on either a self-hosted Linux runner (if one is available)
# or falls back to GitHub-hosted ubuntu-latest.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Ensure the workflow token can list self-hosted runners.
permissions:
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Probe whether a suitable self-hosted linux runner is available for this repo.
  choose-runner:
    name: choose runner
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for online self-hosted linux runners
        id: check
        uses: actions/github-script@v6
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            // List runners for the repo
            const resp = await github.request('GET /repos/{owner}/{repo}/actions/runners', { owner, repo });
            const runners = (resp.data && resp.data.runners) || [];
            // Consider a runner suitable if it's online and has both 'self-hosted' and 'linux' labels.
            const suitable = runners.some(r =>
              r.status === 'online' &&
              r.labels.some(l => l.name === 'self-hosted') &&
              r.labels.some(l => l.name === 'linux')
            );
            const chosen = suitable ? 'self-hosted' : 'ubuntu-latest';
            core.setOutput('runner', chosen);

  test:
    name: test (linux x86_64)
    needs: choose-runner
    # Dynamically choose runner based on the probe result above.
    runs-on: ${{ needs.choose-runner.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libgl-dev libjack-dev libx11-xcb-dev libxcb1-dev \
            libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: Default test suite
        run: cargo test -p ba283 --release -- --skip probe_latency_is_documented
      - name: Alias-sweep regression guard (measure feature)
        run: cargo test -p ba283 --release --features measure --test alias_sweep
      - name: Additive-feature build guard (--no-default-features)
        run: cargo build -p ba283 --no-default-features
