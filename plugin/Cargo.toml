[package]
name = "ba283"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "f36931f7af4646065488a9845d8f8c2f95252c23", features = ["vst3", "standalone"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "f36931f7af4646065488a9845d8f8c2f95252c23" }
serde_json = "1"
atomic_float = "1"
# Task 3.2: pure-Rust hand-coded LSTM(1,32)+FiLM+Dense(1) (see src/model.rs); rtneural-rs not used.
hound = "3"

[dev-dependencies]
# `warn_release` so the alloc check is ACTIVE in `--release` test builds and
# records violations (the default `disable_release` makes it a no-op in release,
# and the abort mode would kill the test process instead of failing the test).
# The test asserts `violation_count() == 0`.
assert_no_alloc = { version = "1.1", default-features = false, features = ["warn_debug", "warn_release"] }
# Parse the WaveNet golden-parity fixture (tests/fixtures/wavenet_golden.json). Same version as the
# normal dependency, so cargo dedups it — no extra build cost.
serde_json = "1"

[features]
# Compile-in the sub-rate Newton spike (NO-GO; evaluated 2026-06-09, kept for the record only).
# Off by default — zero subrate fields, branches, or memory in the release build.
# Enable with: cargo build/test --features subrate-spike
subrate-spike = []
# Nonlinear Jiles-Atherton transformer-core model (the `trafo` knob). Promoted to a default
# feature after the GO verdict (PR #38/#41): all standard builds include it and expose the knob.
# Opt out with `--no-default-features` for a bit-exact linear-transformer A/B build.
default = ["trafo-core"]
trafo-core = []
# Measurement-only hooks (alias-sweep harness). Additive, off by default — never in the shipped
# plugin. Gates `WdfModel::capture_os_raw` + the `tests/alias_sweep.rs` broadband-alias harness.
# Run with: cargo test --features measure --release --test alias_sweep -- --nocapture
measure = []
# Bench-only re-exports (depletion_charge LUT spike, Phase 0). Exposes the otherwise
# pub(in crate::wdf) hot fn `depletion_charge_pre_batch` so `bin/bench_deplut` can time it.
# Additive, off by default — never in the shipped plugin.
bench-internals = []

[[bin]]
name = "ba283_standalone"
path = "src/bin/standalone.rs"

[[bin]]
name = "bench_deplut"
path = "src/bin/bench_deplut.rs"
required-features = ["bench-internals"]
