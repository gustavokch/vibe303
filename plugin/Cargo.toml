[package]
name = "ba283"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "f36931f7af4646065488a9845d8f8c2f95252c23", features = ["vst3", "standalone"] }
serde_json = "1"
atomic_float = "1"
# Task 3.2: pure-Rust hand-coded GRU(2,32)+Dense(1) (see src/model.rs); rtneural-rs not used.
hound = "3"

[dev-dependencies]
assert_no_alloc = "1.1"

[[bin]]
name = "ba283_standalone"
path = "src/bin/standalone.rs"
