[package]
name = "plugin303"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "f36931f7af4646065488a9845d8f8c2f95252c23", features = ["vst3"] }
# nih_plug_egui re-added (behind a `gui` feature) when the GUI milestone starts.

[dev-dependencies]
assert_no_alloc = { version = "1.1", default-features = false, features = ["warn_debug", "warn_release"] }
serde_json = "1"
