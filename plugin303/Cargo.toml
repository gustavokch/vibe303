[package]
name = "plugin303"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "f36931f7af4646065488a9845d8f8c2f95252c23", features = ["vst3"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "f36931f7af4646065488a9845d8f8c2f95252c23", optional = true }
serde_json = "1.0.150"
serde = { version = "1.0", features = ["derive"] }

[features]
default = ["gui", "standalone"]
standalone = ["nih_plug/standalone"]
gui = ["dep:nih_plug_egui"]
current-iteration = []

[dev-dependencies]
assert_no_alloc = { version = "1.1", default-features = false, features = [
    "warn_debug",
    "warn_release",
] }
serde_json = "1.0.150"

# standalone needs nih_plug/standalone; without this, --no-default-features
# test builds fail.
[[bin]]
name = "standalone"
required-features = ["standalone"]

# Bins are test-exempt by policy (no #[test] in any bin; skips codegen+link
# of these bins in test builds). Does not affect `cargo run --bin ...`.
[[bin]]
name = "debug_note84"
test = false

[[bin]]
name = "eval_clipper"
test = false

[[bin]]
name = "gen_acid"
test = false

[[bin]]
name = "measure_swing"
test = false

[[bin]]
name = "render303"
test = false

[[bin]]
name = "profile_voice"
test = false

[[bin]]
name = "scratch_pitch"
test = false

[[bin]]
name = "scratch_voice"
test = false

[[bin]]
name = "vco_pitch_sweep"
test = false

[[bin]]
name = "vcf_sweep_helper"
test = false